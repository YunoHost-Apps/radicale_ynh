#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;

#sub_path_only  proxy_set_header X-Script-Name __PATH__;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  # Not spoofable, read by Fail2Ban
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Remote-Addr $remote_addr;

  # Same as max_content_length in Radicale's configuration
  client_max_body_size 100M;
}
#wellknown#
#wellknown#location = /.well-known/caldav {
#wellknown#  return 301 https://$host__PATH__/;
#wellknown#}
#wellknown#
#wellknown#location = /.well-known/carddav {
#wellknown#  return 301 https://$host__PATH__/;
#wellknown#}
