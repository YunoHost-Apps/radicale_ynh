#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;
  include    proxy_params_no_auth;
#sub_path_only  proxy_set_header X-Script-Name __PATH__;

  # Same as max_content_length in Radicale's configuration
  client_max_body_size 100M;
}
#wellknown#
#wellknown#location = /.well-known/caldav {
#wellknown#  return 301 https://$host__PATH__/;
#wellknown#}
#wellknown#
#wellknown#location = /.well-known/carddav {
#wellknown#  return 301 https://$host__PATH__/;
#wellknown#}
